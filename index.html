<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ 酷炫 TodoList</title>
  <style>
    /* ===== 全局重置 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== 背景动态渐变 ===== */
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: bgShift 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      overflow-x: hidden;
    }

    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== 浮动粒子 ===== */
    .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ===== 主容器：玻璃拟态 ===== */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
      padding: 36px 32px;
    }

    /* ===== 标题区 ===== */
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }
    .header p { color: rgba(255,255,255,0.45); font-size: 0.9rem; margin-top: 6px; }

    /* ===== 统计条 ===== */
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-card .num {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }
    .stat-card .label { font-size: 0.72rem; color: rgba(255,255,255,0.45); margin-top: 2px; }
    .stat-card.total .num  { color: #a78bfa; }
    .stat-card.done  .num  { color: #34d399; }
    .stat-card.left  .num  { color: #60a5fa; }

    /* ===== 进度条 ===== */
    .progress-bar-wrap {
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      height: 6px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }

    /* ===== 输入区 ===== */
    .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
    .input-area input {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-area input::placeholder { color: rgba(255,255,255,0.3); }
    .input-area input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(167,139,250,0.2);
    }

    .priority-select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .priority-select option { background: #302b63; color: #fff; }

    .add-btn {
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(167,139,250,0.4);
    }
    .add-btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(167,139,250,0.5); }
    .add-btn:active { transform: translateY(0); }

    /* ===== 过滤标签 ===== */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 99px;
      padding: 6px 16px;
      color: rgba(255,255,255,0.5);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: rgba(167,139,250,0.25);
      border-color: #a78bfa;
      color: #fff;
    }

    /* ===== 任务列表 ===== */
    .todo-list { display: flex; flex-direction: column; gap: 10px; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 14px 16px;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      animation: slideIn 0.3s ease;
      cursor: default;
    }
    .todo-item:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.2);
      transform: translateX(4px);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(0.9); }
    }

    /* 自定义复选框 */
    .check-box {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      flex-shrink: 0;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s;
      font-size: 0.75rem;
    }
    .check-box:hover  { border-color: #34d399; transform: scale(1.1); }
    .todo-item.done .check-box {
      background: linear-gradient(135deg, #34d399, #059669);
      border-color: transparent;
    }

    .todo-text {
      flex: 1;
      color: rgba(255,255,255,0.9);
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-all;
      transition: all 0.3s;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: rgba(255,255,255,0.3);
    }

    /* 优先级标签 */
    .priority-tag {
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 99px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .p-high   { background: rgba(239,68,68,0.2);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .p-mid    { background: rgba(251,146,60,0.2); color: #fdba74; border: 1px solid rgba(251,146,60,0.3); }
    .p-low    { background: rgba(52,211,153,0.2); color: #6ee7b7; border: 1px solid rgba(52,211,153,0.3); }

    /* 删除按钮 */
    .del-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.2);
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .del-btn:hover { color: #f87171; background: rgba(239,68,68,0.1); }

    /* ===== 空状态 ===== */
    .empty {
      text-align: center;
      padding: 48px 0;
      color: rgba(255,255,255,0.25);
      font-size: 0.9rem;
    }
    .empty .icon { font-size: 3rem; margin-bottom: 12px; }

    /* ===== 底部操作 ===== */
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .footer-actions span { color: rgba(255,255,255,0.35); font-size: 0.8rem; }
    .clear-btn {
      background: none;
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 6px 14px;
      color: #fca5a5;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .clear-btn:hover { background: rgba(239,68,68,0.15); }

    /* ===== 响应式 ===== */
    @media (max-width: 480px) {
      .container { padding: 24px 16px; }
      .header h1 { font-size: 1.6rem; }
      .stats { gap: 8px; }
    }
  </style>
</head>
<body>

<!-- 粒子背景 -->
<div class="particles" id="particles"></div>

<div class="container">
  <!-- 标题 -->
  <div class="header">
    <h1>✨ 酷炫 TodoList</h1>
    <p>把想做的事记下来，一件一件完成它</p>
  </div>

  <!-- 统计卡片 -->
  <div class="stats">
    <div class="stat-card total">
      <div class="num" id="stat-total">0</div>
      <div class="label">全部任务</div>
    </div>
    <div class="stat-card done">
      <div class="num" id="stat-done">0</div>
      <div class="label">已完成</div>
    </div>
    <div class="stat-card left">
      <div class="num" id="stat-left">0</div>
      <div class="label">待完成</div>
    </div>
  </div>

  <!-- 进度条 -->
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>

  <!-- 输入区 -->
  <div class="input-area">
    <input type="text" id="todo-input" placeholder="添加新任务..." maxlength="100" />
    <select class="priority-select" id="priority-select">
      <option value="high">🔴 高</option>
      <option value="mid" selected>🟡 中</option>
      <option value="low">🟢 低</option>
    </select>
    <button class="add-btn" id="add-btn" title="添加">＋</button>
  </div>

  <!-- 过滤标签 -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="active">待完成</button>
    <button class="filter-btn" data-filter="done">已完成</button>
    <button class="filter-btn" data-filter="high">🔴 高优先</button>
    <button class="filter-btn" data-filter="mid">🟡 中优先</button>
    <button class="filter-btn" data-filter="low">🟢 低优先</button>
  </div>

  <!-- 任务列表 -->
  <div class="todo-list" id="todo-list"></div>

  <!-- 底部操作 -->
  <div class="footer-actions">
    <span id="footer-tip">数据已保存到本地</span>
    <button class="clear-btn" id="clear-done-btn">清除已完成</button>
  </div>
</div>

<script>
  /* ===== 粒子生成 ===== */
  (function () {
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 60 + 10;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random() * 100}%;
        animation-duration:${Math.random() * 15 + 10}s;
        animation-delay:${Math.random() * 10}s;
        opacity:${Math.random() * 0.4 + 0.05};
      `;
      container.appendChild(p);
    }
  })();

  /* ===== 数据管理 ===== */
  const STORAGE_KEY = 'cool-todolist-v1';
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentFilter = 'all';

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  /* ===== 渲染 ===== */
  function getFilteredTodos() {
    switch (currentFilter) {
      case 'active': return todos.filter(t => !t.done);
      case 'done':   return todos.filter(t => t.done);
      case 'high':   return todos.filter(t => t.priority === 'high');
      case 'mid':    return todos.filter(t => t.priority === 'mid');
      case 'low':    return todos.filter(t => t.priority === 'low');
      default:       return todos;
    }
  }

  const priorityMap = {
    high: { label: '高', cls: 'p-high' },
    mid:  { label: '中', cls: 'p-mid'  },
    low:  { label: '低', cls: 'p-low'  },
  };

  function render() {
    const list = document.getElementById('todo-list');
    const filtered = getFilteredTodos();

    // 更新统计
    const total = todos.length;
    const done  = todos.filter(t => t.done).length;
    const left  = total - done;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-done').textContent  = done;
    document.getElementById('stat-left').textContent  = left;
    document.getElementById('progress-bar').style.width = total ? (done / total * 100) + '%' : '0%';

    // 列表
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty"><div class="icon">${currentFilter === 'done' ? '🎉' : '📝'}</div>${currentFilter === 'done' ? '还没有完成的任务' : '暂无任务，添加一个吧！'}</div>`;
      return;
    }

    list.innerHTML = '';
    filtered.forEach(todo => {
      const item = document.createElement('div');
      item.className = 'todo-item' + (todo.done ? ' done' : '');
      item.dataset.id = todo.id;

      const p = priorityMap[todo.priority] || priorityMap.mid;
      item.innerHTML = `
        <div class="check-box" data-action="toggle" title="点击完成/撤销">${todo.done ? '✓' : ''}</div>
        <div class="todo-text">${escHtml(todo.text)}</div>
        <span class="priority-tag ${p.cls}">${p.label}</span>
        <button class="del-btn" data-action="delete" title="删除">✕</button>
      `;
      list.appendChild(item);
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ===== 添加任务 ===== */
  function addTodo() {
    const input = document.getElementById('todo-input');
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    const priority = document.getElementById('priority-select').value;
    todos.unshift({ id: genId(), text, priority, done: false, createdAt: Date.now() });
    save();
    render();
    input.value = '';
    input.focus();
  }

  /* ===== 事件绑定 ===== */
  document.getElementById('add-btn').addEventListener('click', addTodo);
  document.getElementById('todo-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  // 列表事件委托
  document.getElementById('todo-list').addEventListener('click', e => {
    const action = e.target.dataset.action;
    if (!action) return;
    const item = e.target.closest('.todo-item');
    if (!item) return;
    const id = item.dataset.id;

    if (action === 'toggle') {
      const todo = todos.find(t => t.id === id);
      if (todo) { todo.done = !todo.done; save(); render(); }
    } else if (action === 'delete') {
      item.style.animation = 'fadeOut 0.25s ease forwards';
      setTimeout(() => {
        todos = todos.filter(t => t.id !== id);
        save();
        render();
      }, 240);
    }
  });

  // 过滤按钮
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  // 清除已完成
  document.getElementById('clear-done-btn').addEventListener('click', () => {
    if (todos.every(t => !t.done)) return;
    todos = todos.filter(t => !t.done);
    save();
    render();
  });

  /* ===== 初始渲染 ===== */
  render();
</script>
</body>
</html>
